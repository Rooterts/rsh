[package]
name = "rsh"
version = "0.1.0"
edition = "2024"

[dependencies]
# Only the history feature is needed (load_history/save_history). The default
# features pull in extra crates (completion trie, home dirs) that rsh does not use.
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
glob = "0.3"

[[bin]]
name = "rsh"
path = "src/main.rs"
